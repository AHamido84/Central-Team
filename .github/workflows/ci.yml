name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: Central <no-reply@central.test>
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 54325
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start Supabase
        run: pnpm db:start
      - name: Export Supabase keys
        run: |
          supabase status -o env | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=' | sed -E 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' | tr -d '"' >> "$GITHUB_ENV"
      - name: Reset and seed database
        run: pnpm db:reset
      - run: pnpm test:db

      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: |
          pnpm start &
          npx wait-on http://localhost:3000/api/health
          E2E_BASE_URL=http://localhost:3000 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
